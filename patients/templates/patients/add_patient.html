{% extends 'base.html' %}
{% block title %}Tambah Pasien{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 700px;">

    <div class="card shadow">

        <div class="card-header">
            <h2 class="mb-0">Tambah Data Pasien</h2>
        </div>

        <div class="card-body">

            <!-- action="" berarti submit ke url yang sama (halaman form ini sendiri) -->
            <form action="{% url 'patients:add' %}" method="post">
                {% csrf_token %}

                <!-- ===================== NAMA LENGKAP ===================== -->
                <div class="mb-3">
                    <label for="full_name" class="form-label">Nama Lengkap</label>
                    <input type="text" class="form-control" name="full_name" id="full_name" required>
                </div>

                <!-- ===================== JENIS KELAMIN ===================== -->
                <div class="mb-3">
                    <label class="form-label d-block">Jenis Kelamin</label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="gender_L" value="L" required>
                        <label class="form-check-label" for="gender_L">Laki-laki</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="gender" id="gender_P" value="P">
                        <label class="form-check-label" for="gender_P">Perempuan</label>
                    </div>
                </div>

                <!-- ===================== TANGGAL LAHIR & TANGGAL MASUK ===================== -->
                <div class="row mb-3">
                    <div class="col-md-6">
                        <label for="birth_date" class="form-label">Tanggal Lahir</label>
                        <input type="date" class="form-control" name="birth_date" id="birth_date" required>
                    </div>
                    <div class="col-md-6">
                        <label for="admission_date" class="form-label">Tanggal Masuk</label>
                        <input type="date" class="form-control" name="admission_date" id="admission_date" required>
                    </div>
                </div>

                <!-- ===================== STATUS ===================== -->
                <div class="mb-3">
                    <label class="form-label d-block">Status</label>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="status" id="status_active" value="active" checked>
                        <label class="form-check-label" for="status_active">Active</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="status" id="status_sakit" value="sakit">
                        <label class="form-check-label" for="status_sakit">Sakit</label>
                    </div>

                    <div class="form-check form-check-inline">
                        <input class="form-check-input" type="radio" name="status" id="status_dikembalikan" value="dikembalikan">
                        <label class="form-check-label" for="status_dikembalikan">Dikembalikan</label>
                    </div>
                </div>

                <!-- ===================== ALAMAT ===================== -->
                <div class="mb-4">
                    <label for="address" class="form-label">Alamat</label>
                    <input type="text" class="form-control" name="address" id="address" required>
                </div>

                <!-- ===================== TOMBOL AKSI ===================== -->
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary">Simpan</button>
                    <a href="{% url 'patients:list_patient' %}" class="btn btn-secondary">Batal</a>
                </div>

            </form>

        </div>

    </div>

</div>

{% endblock %}
